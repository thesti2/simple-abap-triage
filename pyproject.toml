[project]
name = "abap-triage"
version = "0.1.0"
description = "ABAP dump triage: xMatters -> LangGraph triage -> Slack -> fix -> TR release"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langsmith>=0.3",
    "slack-bolt>=1.21",
    "slack-sdk>=3.33",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls real external services (OpenRouter / Slack); run with -m live",
]
addopts = "-m 'not live'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
